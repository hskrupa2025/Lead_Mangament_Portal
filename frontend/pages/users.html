<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Management - Lead Management</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
  </head>
  <body class="bg-light">
    <div class="d-flex flex-column flex-md-row min-vh-100">
      <nav class="sidebar bg-dark text-white p-3 col-md-3 col-lg-2">
        <div
          class="d-flex align-items-center mb-4 text-white text-decoration-none"
        >
          <i class="bi bi-speedometer2 fs-4 me-2 text-primary"></i>
          <span class="fs-5 fw-bold">Admin Portal</span>
        </div>
        <hr />
        <ul class="nav nav-pills flex-column mb-auto">
          <li class="nav-item">
            <a href="admin-dashboard.html" class="nav-link text-white-50"
              ><i class="bi bi-house-door me-2"></i> Dashboard</a
            >
          </li>
          <li class="nav-item">
            <a href="leads.html" class="nav-link text-white-50"
              ><i class="bi bi-card-list me-2"></i> All Leads</a
            >
          </li>
          <li class="nav-item">
            <a href="users.html" class="nav-link active text-white"
              ><i class="bi bi-people me-2"></i> User Management</a
            >
          </li>
        </ul>
        <hr />
        <div class="dropdown">
          <button
            class="btn btn-dark dropdown-toggle w-100 text-start d-flex align-items-center"
            type="button"
            data-bs-toggle="dropdown"
          >
            <i class="bi bi-person-circle fs-5 me-2"></i>
            <span id="currentUserLabel" class="text-truncate">Admin</span>
          </button>
          <ul class="dropdown-menu dropdown-menu-dark shadow">
            <li>
              <button class="dropdown-item" id="logoutBtn">
                <i class="bi bi-box-arrow-right me-2"></i> Logout
              </button>
            </li>
          </ul>
        </div>
      </nav>

      <main class="flex-grow-1 p-4 overflow-auto">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div>
            <h2 class="fw-bold m-0">User Accounts</h2>
            <p class="text-muted small m-0">
              Create, manage, and toggle status of system users
            </p>
          </div>
          <button class="btn btn-primary" id="createUserModalBtn">
            <i class="bi bi-person-plus me-1"></i> Add System User
          </button>
        </div>

        <div id="alertContainer"></div>

        <div class="card border-0 shadow-sm rounded-3">
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                  <tr>
                    <th>Name</th>
                    <th>Email Address</th>
                    <th>Role</th>
                    <th>Status</th>
                    <th>Created Date</th>
                    <th class="text-end">Actions</th>
                  </tr>
                </thead>
                <tbody id="usersTableBody">
                  <tr>
                    <td colspan="6" class="text-center py-4">
                      <span
                        class="spinner-border spinner-border-sm text-primary"
                      ></span>
                      Loading users...
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>

    <div class="modal fade" id="userModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title fw-bold" id="userModalTitle">
              Add System User
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <form id="userForm" novalidate>
            <div class="modal-body">
              <input type="hidden" id="userId" />
              <div class="mb-3">
                <label for="uName" class="form-label fw-bold"
                  >Full Name <span class="text-danger">*</span></label
                >
                <input type="text" class="form-control" id="uName" required />
              </div>
              <div class="mb-3">
                <label for="uEmail" class="form-label fw-bold"
                  >Email Address <span class="text-danger">*</span></label
                >
                <input type="email" class="form-control" id="uEmail" required />
              </div>
              <div class="mb-3" id="passwordGroup">
                <label for="uPassword" class="form-label fw-bold" id="uPasswordLabel"
                  >Password <span class="text-danger">*</span></label
                >
                <input type="password" class="form-control" id="uPassword" />
                <div class="form-text" id="uPasswordHelp"></div>
              </div>
              <div class="mb-3">
                <label for="uRole" class="form-label fw-bold"
                  >Role <span class="text-danger">*</span></label
                >
                <select class="form-select" id="uRole" required>
                  <option value="USER">USER</option>
                  <option value="ADMIN">ADMIN</option>
                </select>
              </div>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Cancel
              </button>
              <button type="submit" class="btn btn-primary" id="saveUserBtn">
                Save User
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/users.js"></script>
  </body>
</html>
