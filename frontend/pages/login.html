<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lead Management Portal</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
  </head>
  <body
    class="bg-light d-flex align-items-center justify-content-center min-vh-100"
  >
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
          <div class="card shadow-sm border-0 rounded-3">
            <div class="card-body p-4">
              <div class="text-center mb-4">
                <div
                  class="avatar-icon bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-2"
                  style="width: 48px; height: 48px"
                >
                  <i class="bi bi-person-badge fs-4"></i>
                </div>
                <h1 class="h4 fw-bold">Lead Management Portal</h1>
                <p class="text-muted small">
                  Enter your credentials to access your portal
                </p>
              </div>

              <div id="alertContainer"></div>

              <form id="loginForm" novalidate>
                <div class="mb-3">
                  <label for="email" class="form-label"
                    >Email or Username</label
                  >
                  <div class="input-group">
                    <span class="input-group-text"
                      ><i class="bi bi-envelope"></i
                    ></span>
                    <input
                      type="text"
                      class="form-control"
                      id="email"
                      placeholder="admin or name@company.com"
                      required
                      autocomplete="username"
                    />
                    <div class="invalid-feedback">
                      Please enter a valid email or username.
                    </div>
                  </div>
                </div>

                <div class="mb-3">
                  <label for="password" class="form-label">Password</label>
                  <div class="input-group">
                    <span class="input-group-text"
                      ><i class="bi bi-lock"></i
                    ></span>
                    <input
                      type="password"
                      class="form-control"
                      id="password"
                      placeholder="••••••••"
                      required
                      autocomplete="current-password"
                    />
                    <button
                      class="btn btn-outline-secondary"
                      type="button"
                      id="togglePasswordBtn"
                    >
                      <i class="bi bi-eye" id="togglePasswordIcon"></i>
                    </button>
                    <div class="invalid-feedback">
                      Please enter your password.
                    </div>
                  </div>
                </div>

                <button
                  type="submit"
                  class="btn btn-primary w-100 py-2 mt-2"
                  id="loginBtn"
                >
                  <span id="loginBtnText">Sign In</span>
                  <span
                    id="loginSpinner"
                    class="spinner-border spinner-border-sm d-none"
                    role="status"
                    aria-hidden="true"
                  ></span>
                </button>
              </form>
            </div>
          </div>
          <p class="text-center text-muted small mt-3">
            &copy; 2026 Lead Management Portal
          </p>
        </div>
      </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", async () => {
        if (Auth.isLoggedIn()) {
          Auth.redirectByRole();
          return;
        }

        const form = document.getElementById("loginForm");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const toggleBtn = document.getElementById("togglePasswordBtn");
        const toggleIcon = document.getElementById("togglePasswordIcon");
        const loginBtn = document.getElementById("loginBtn");
        const loginBtnText = document.getElementById("loginBtnText");
        const loginSpinner = document.getElementById("loginSpinner");

        toggleBtn.addEventListener("click", () => {
          const isPassword = passwordInput.getAttribute("type") === "password";
          passwordInput.setAttribute("type", isPassword ? "text" : "password");
          toggleIcon.className = isPassword ? "bi bi-eye-slash" : "bi bi-eye";
        });

        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          UI.clearAlerts();

          if (!form.checkValidity()) {
            form.classList.add("was-validated");
            return;
          }

          loginBtn.disabled = true;
          loginBtnText.textContent = "Signing in...";
          loginSpinner.classList.remove("d-none");

          try {
            const res = await API.post("/auth/login", {
              email: emailInput.value.trim(),
              password: passwordInput.value,
            });

            if (res.success || res.token) {
              Auth.setSession(
                res.token,
                res.user || res.data?.user || res.data,
              );
              UI.showAlert("Login successful! Redirecting...", "success");
              setTimeout(() => Auth.redirectByRole(), 600);
            } else {
              UI.showAlert(
                res.message || "Invalid credentials provided.",
                "danger",
              );
            }
          } catch (err) {
            UI.showAlert(
              err.message || "Unable to connect to the authentication server.",
              "danger",
            );
          } finally {
            loginBtn.disabled = false;
            loginBtnText.textContent = "Sign In";
            loginSpinner.classList.add("d-none");
          }
        });
      });
    </script>
  </body>
</html>
