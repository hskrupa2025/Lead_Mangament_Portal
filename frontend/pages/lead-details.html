<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lead Details - Lead Management</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
  </head>
  <body class="bg-light">
    <div class="container py-4">
      <div class="d-flex align-items-center justify-content-between mb-4">
        <a href="leads.html" class="btn btn-outline-secondary btn-sm"
          ><i class="bi bi-arrow-left me-1"></i> Back to Directory</a
        >
        <div id="actionButtons" class="d-flex gap-2"></div>
      </div>

      <h2 class="fw-bold mb-4">Lead Details and Follow-Up History</h2>

      <div id="alertContainer"></div>

      <div id="loadingState" class="text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-2 text-muted">Loading lead information...</p>
      </div>

      <div id="detailsContent" class="d-none">
        <div class="row g-4">
          <div class="col-lg-7">
            <div class="card border-0 shadow-sm rounded-3 mb-4">
              <div
                class="card-header bg-white border-0 py-3 d-flex justify-content-between align-items-center"
              >
                <h4 class="fw-bold m-0" id="leadNameTitle">Lead Details</h4>
                <span id="statusBadge"></span>
              </div>
              <div class="card-body">
                <div class="row g-3">
                  <div class="col-sm-6">
                    <label class="text-muted small d-block">Company Name</label>
                    <strong id="dCompany" class="fs-6">-</strong>
                  </div>
                  <div class="col-sm-6">
                    <label class="text-muted small d-block"
                      >Estimated Value</label
                    >
                    <strong id="dValue" class="fs-6 text-success">-</strong>
                  </div>
                  <div class="col-sm-6">
                    <label class="text-muted small d-block">Mobile</label>
                    <span id="dMobile">-</span>
                  </div>
                  <div class="col-sm-6">
                    <label class="text-muted small d-block">Email</label>
                    <span id="dEmail">-</span>
                  </div>
                  <div class="col-sm-6">
                    <label class="text-muted small d-block"
                      >Service Required</label
                    >
                    <span id="dService" class="badge bg-light text-dark border"
                      >-</span
                    >
                  </div>
                  <div class="col-sm-6">
                    <label class="text-muted small d-block">Lead Source</label>
                    <span id="dSource">-</span>
                  </div>
                  <div class="col-sm-6">
                    <label class="text-muted small d-block">Assigned To</label>
                    <span id="dAssignedTo" class="fw-semibold">-</span>
                  </div>
                  <div class="col-sm-6">
                    <label class="text-muted small d-block">Created On</label>
                    <span id="dCreated">-</span>
                  </div>
                  <div class="col-12">
                    <label class="text-muted small d-block"
                      >Remarks / Notes</label
                    >
                    <div
                      class="p-3 bg-light rounded border text-secondary"
                      id="dRemarks"
                    >
                      No remarks provided.
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="col-lg-5">
            <div class="card border-0 shadow-sm rounded-3">
              <div
                class="card-header bg-white border-0 py-3 d-flex justify-content-between align-items-center"
              >
                <h5 class="fw-bold m-0">
                  <i class="bi bi-clock-history me-2 text-primary"></i>Follow-Up
                  History
                </h5>
                <button
                  class="btn btn-sm btn-primary"
                  data-bs-toggle="modal"
                  data-bs-target="#followUpModal"
                >
                  <i class="bi bi-plus-lg"></i> Add Log
                </button>
              </div>
              <div class="card-body">
                <div id="followUpTimeline">
                  <p class="text-muted small">Loading follow-ups...</p>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="card border-0 shadow-sm rounded-3 mb-4">
          <div class="card-header bg-white border-0 py-3">
            <h5 class="fw-bold m-0">
              <i class="bi bi-arrow-repeat me-2 text-primary"></i>Lead Flow
            </h5>
          </div>
          <div class="card-body">
            <div id="statusTimeline">
              <p class="text-muted small">Loading status history...</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="followUpModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title fw-bold">Log New Follow-Up</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <form id="followUpForm" novalidate>
            <div class="modal-body">
              <div class="mb-3">
                <label for="fType" class="form-label fw-bold"
                  >Follow-Up Type <span class="text-danger">*</span></label
                >
                <select class="form-select" id="fType" required>
                  <option value="Phone Call">Phone Call</option>
                  <option value="Email">Email</option>
                  <option value="Meeting">Meeting</option>
                  <option value="WhatsApp">WhatsApp</option>
                  <option value="Demo">Demo</option>
                  <option value="Proposal Discussion">
                    Proposal Discussion
                  </option>
                  <option value="Other">Other</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="fDate" class="form-label fw-bold"
                  >Date & Time <span class="text-danger">*</span></label
                >
                <input
                  type="datetime-local"
                  class="form-control"
                  id="fDate"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="fNextDate" class="form-label fw-bold"
                  >Next Follow-Up Date</label
                >
                <input type="date" class="form-control" id="fNextDate" />
              </div>
              <div class="mb-3">
                <label for="fRemarks" class="form-label fw-bold"
                  >Remarks <span class="text-danger">*</span></label
                >
                <textarea
                  class="form-control"
                  id="fRemarks"
                  rows="3"
                  required
                  placeholder="Details of conversation..."
                ></textarea>
              </div>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Cancel
              </button>
              <button
                type="submit"
                class="btn btn-primary"
                id="saveFollowUpBtn"
              >
                Save Log
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/lead-details.js"></script>
  </body>
</html>
